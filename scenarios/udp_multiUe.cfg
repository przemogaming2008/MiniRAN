# Lossy MultiUE run to exercise retransmission logic
scenario_name = udp_lossy_multi_ue
transport_mode = udp

access_node_id = 1000
step_ms = 10
scenario_duration_ms = 4000

network_seed = 1337
traffic_seed = 7

attach_timeout_ms = 180
detach_timeout_ms = 180
heartbeat_interval_ms = 200
inactivity_timeout_ms = 700
max_attach_retries = 4
max_detach_retries = 3

latency_ms = 25
jitter_ms = 8
loss_percent = 7
reorder_percent = 12
bandwidth_kbps = 8000
queue_limit_packets = 128

ue_count = 3

ue.0.node_id = 7
ue.0.ue_id = 7
ue.0.attach_start_ms = 0
ue.0.traffic_start_ms = 1200
ue.0.traffic_end_ms = 2400
ue.0.uplink.traffic_pattern = bursty
ue.0.uplink.packet_size_bytes = 192
ue.0.uplink.packets_per_second = 12
ue.0.uplink.burst_packets = 5
ue.0.uplink.burst_interval_ms = 220
ue.0.uplink.ramp_start_pps = 4
ue.0.uplink.ramp_end_pps = 20
ue.0.downlink_enabled = false

ue.1.node_id = 8
ue.1.ue_id = 8
ue.1.attach_start_ms = 300
ue.1.traffic_start_ms = 1400
ue.1.traffic_end_ms = 2600
ue.1.uplink.traffic_pattern = cbr
ue.1.uplink.packet_size_bytes = 128
ue.1.uplink.packets_per_second = 15
ue.1.uplink.burst_packets = 5
ue.1.uplink.burst_interval_ms = 220
ue.1.uplink.ramp_start_pps = 4
ue.1.uplink.ramp_end_pps = 20
ue.1.downlink_enabled = false

ue.2.node_id = 9
